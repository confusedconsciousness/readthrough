<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Readthrough</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cstyle%3Ecircle%7Bfill:%23111%7Dpath%7Bfill:none;stroke:%23111%7D@media (prefers-color-scheme:dark)%7Bcircle%7Bfill:%23f2f2f2%7Dpath%7Bstroke:%23f2f2f2%7D%7D%3C/style%3E%3Ccircle cx='3.5' cy='12.5' r='2'/%3E%3Ccircle cx='12.5' cy='3.5' r='2'/%3E%3Cpath d='M3.5 10.5V8a3 3 0 0 1 3-3h4' stroke-width='1.5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
<script>try { const r = document.documentElement, t = JSON.parse(localStorage.getItem('odyssey:theme')), v = JSON.parse(localStorage.getItem('odyssey:vars')); if (t) r.dataset.theme = t; if (v) for (const k in v) r.style.setProperty(k, v[k]) } catch {}</script>
</head>
<body>
<header class="top">
  <a class="brand" href="#/" aria-label="Your tours">
    <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3.5" cy="12.5" r="2"/><circle cx="12.5" cy="3.5" r="2"/><path d="M3.5 10.5V8a3 3 0 0 1 3-3h4"/></svg>
    <span>Readthrough</span>
  </a>
  <div class="crumb" id="crumb"></div>
  <form class="go" autocomplete="off">
    <input name="pr" id="pr-input" placeholder="Open a pull request…" aria-label="Pull request link" spellcheck="false">
    <kbd>/</kbd>
  </form>
  <div class="account" id="account"></div>
  <button id="gear" class="icon" aria-label="Choose the AI that reads PRs" title="Choose the AI that reads PRs">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5h7M12 4.5h2M2 11.5h2M7 11.5h7"/><circle cx="10.5" cy="4.5" r="1.5"/><circle cx="5.5" cy="11.5" r="1.5"/></svg>
  </button>
  <details class="menu" id="appearance">
    <summary class="icon" aria-label="Appearance: mode and palette" title="Appearance">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5a5.5 5.5 0 0 1 0 11z" class="fill"/></svg>
    </summary>
    <div class="menu-pop appearance-pop" id="appearance-pop"></div>
  </details>
</header>
<main id="view"></main>
<footer class="status" id="status"></footer>
<dialog id="settings" class="sheet" aria-labelledby="settings-h">
  <form id="settings-form" autocomplete="off"></form>
</dialog>
<script src="app.js"></script>
</body>
</html>
